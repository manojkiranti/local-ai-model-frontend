<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Radial burst logo</title>
  <desc id="desc">A sixteen-spoke radial burst logo in #b8352c with a transparent background.</desc>

  <style>
    /*
      Animation-ready:
      - Add class="animate-spin" to the group below for rotation.
      - Add class="animate-pulse" to the group below for a soft pulse.
    */
    .burst {
      transform-origin: 256px 256px;
    }

    .animate-spin {
      animation: spin 4s linear infinite;
    }

    .animate-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.92); }
    }
  </style>

  <defs>
    <!-- One tapered, rounded spoke; reused and rotated around the centre. -->
    <path id="spoke"
          d="M252 210
             C249.8 210 248.6 208.2 248.8 205.8
             L244 108
             C243.5 97.5 248.8 90 256 90
             C263.2 90 268.5 97.5 268 108
             L263.2 205.8
             C263.4 208.2 262.2 210 260 210
             Z"/>
  </defs>

  <!-- Every spoke is a separate element, so each can be animated independently. -->
  <g class="burst" fill="#b8352c">
    <use class="spoke spoke-01" href="#spoke" transform="rotate(0 256 256)"/>
    <use class="spoke spoke-02" href="#spoke" transform="rotate(22.5 256 256)"/>
    <use class="spoke spoke-03" href="#spoke" transform="rotate(45 256 256)"/>
    <use class="spoke spoke-04" href="#spoke" transform="rotate(67.5 256 256)"/>
    <use class="spoke spoke-05" href="#spoke" transform="rotate(90 256 256)"/>
    <use class="spoke spoke-06" href="#spoke" transform="rotate(112.5 256 256)"/>
    <use class="spoke spoke-07" href="#spoke" transform="rotate(135 256 256)"/>
    <use class="spoke spoke-08" href="#spoke" transform="rotate(157.5 256 256)"/>
    <use class="spoke spoke-09" href="#spoke" transform="rotate(180 256 256)"/>
    <use class="spoke spoke-10" href="#spoke" transform="rotate(202.5 256 256)"/>
    <use class="spoke spoke-11" href="#spoke" transform="rotate(225 256 256)"/>
    <use class="spoke spoke-12" href="#spoke" transform="rotate(247.5 256 256)"/>
    <use class="spoke spoke-13" href="#spoke" transform="rotate(270 256 256)"/>
    <use class="spoke spoke-14" href="#spoke" transform="rotate(292.5 256 256)"/>
    <use class="spoke spoke-15" href="#spoke" transform="rotate(315 256 256)"/>
    <use class="spoke spoke-16" href="#spoke" transform="rotate(337.5 256 256)"/>
  </g>
</svg>
